# Раз в 3 дня «будит» бесплатный проект Supabase, чтобы он не уходил в паузу.
# Ничего настраивать не нужно: адрес и ключ берутся из config.js.
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oE "SUPABASE_URL: *'[^']+'" config.js | sed -E "s/.*'([^']+)'/\1/")
          KEY=$(grep -oE "SUPABASE_ANON_KEY: *'[^']+'" config.js | sed -E "s/.*'([^']+)'/\1/")
          curl -sS -o /dev/null -w "status %{http_code}\n" "$URL/rest/v1/rpc/teacher_exists" \
            -X POST -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
